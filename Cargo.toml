[workspace]
resolver = "2"
members = [
    "crates/alarm-engine",
    "crates/driver-api",
    "crates/driver-rockwell",
    "crates/gateway",
    "crates/historian",
    "crates/auth",
    "crates/project-store",
    "crates/protocol",
    "crates/tag-engine",
    "apps/designer/src-tauri",
    "examples/sim-rockwell",
]

# Future members (added as each crate is implemented per docs/roadmap.md):
#   "crates/alarm-engine"     # Phase 3
#   "crates/historian"        # Phase 3
#   "crates/scripting"        # Phase 3 — PyO3 host
#   "crates/auth"             # Phase 3

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/sergiogallegos/OpenWebHMI"
authors = ["Sergio Gallegos <sergiogallegos.net>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
bcrypt = "0.15"
jsonwebtoken = "9"
futures-util = "0.3"
tokio-tungstenite = "0.24"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
rustls-pemfile = "2"
tokio-rustls = "0.26"
# Driver dep — upgraded by version bump (see wiki/drivers/rust-ethernet-ip-integration.md)
rust-ethernet-ip = "0.7"
