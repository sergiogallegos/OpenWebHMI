[workspace]
resolver = "2"
members = [
    "crates/alarm-engine",
    "crates/audit-log",
    "crates/backup",
    "crates/driver-api",
    "crates/driver-ads",
    "crates/driver-opcua",
    "crates/driver-modbus",
    "crates/driver-mqtt",
    "crates/driver-rockwell",
    "crates/gateway",
    "crates/historian",
    "crates/auth",
    "crates/project-store",
    "crates/protocol",
    "crates/scripting",
    "crates/tag-engine",
    "apps/designer/src-tauri",
    "examples/sim-opcua",
    "examples/sim-modbus",
    "examples/sim-mqtt",
    "examples/sim-rockwell",
]

# Future members (added as each crate is implemented per docs/roadmap.md):
#   "crates/scripting"        # Phase 3 — script editor UI follows in CODEX-U

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"
repository = "https://github.com/sergiogallegos/OpenWebHMI"
authors = ["Sergio Gallegos <sergiogallegos.net>"]

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.92"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
futures-util = "0.3.34"
flate2 = "1.1.10"
tokio-tungstenite = "0.30.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10.3"
toml = "1.1.8"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tempfile = "3.27.0"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.6"
tokio-modbus = "=0.17.0"
tokio-serial = "5.5.0"
opcua = { package = "async-opcua", version = "=0.19.0", features = ["client", "server"] }
rumqttc = { version = "=0.25.1", features = ["websocket"] }
rumqttd = "=0.20.0"
prost = "=0.14.4"
jsonpath-rust = "=1.0.12"
ads = "=0.4.4"
# Driver dep — upgraded by version bump (see wiki/drivers/rust-ethernet-ip-integration.md)
rust-ethernet-ip = "1.2.1"
