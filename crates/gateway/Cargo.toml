[package]
name = "openwebhmi-gateway"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenWebHMI gateway binary."

[features]
default = []
sim-tests = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "openwebhmi-gateway"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
openwebhmi-driver-api = { path = "../driver-api" }
openwebhmi-driver-rockwell = { path = "../driver-rockwell" }
openwebhmi-historian = { path = "../historian" }
openwebhmi-auth = { path = "../auth" }
openwebhmi-alarm-engine = { path = "../alarm-engine" }
openwebhmi-audit-log = { path = "../audit-log" }
openwebhmi-backup = { path = "../backup" }
openwebhmi-project-store = { path = "../project-store" }
openwebhmi-protocol = { path = "../protocol" }
openwebhmi-scripting = { path = "../scripting" }
openwebhmi-tag-engine = { path = "../tag-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls-pemfile = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
tempfile = { workspace = true }
