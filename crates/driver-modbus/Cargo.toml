[package]
name = "openwebhmi-driver-modbus"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Modbus TCP/RTU driver for OpenWebHMI."

[features]
default = []
sim-tests = []

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
openwebhmi-driver-api = { path = "../driver-api" }
openwebhmi-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-modbus = { workspace = true }
tokio-serial = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sim-modbus = { path = "../../examples/sim-modbus" }
