[package]
name = "openwebhmi-driver-mqtt"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MQTT and Sparkplug B client driver for OpenWebHMI."

[features]
default = []
sim-tests = []

[lib]
path = "src/lib.rs"

[dependencies]
